name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-lint:
    name: Unit and Lint Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel-disk-cache
            ~/.cache/bazel-repo-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'tools/requirements_lock.txt') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'tools/requirements_lock.txt') }}-
            bazel-${{ runner.os }}-

      - name: Run Unit and Lint Tests
        run: |
          bazel test //... \
            --build_tests_only \
            --test_tag_filters=-science,-openroad,-requires-game-data \
            --disk_cache=~/.cache/bazel-disk-cache \
            --repository_cache=~/.cache/bazel-repo-cache
